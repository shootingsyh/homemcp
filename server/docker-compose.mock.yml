# docker-compose.mock.yml — STANDALONE mock tunneld instance for
# HomeMCP client development. This is a separate deployment profile,
# not an override of docker-compose.yml, and it is NOT the production
# relay: it runs tunneld alone, with mock pay permanently on.
#
#   cp .env.mock.example .env.mock   # then edit API_PUBLIC_BASE etc.
#   docker compose -f docker-compose.mock.yml --env-file .env.mock up -d --build
#
# The client under development points at API_PUBLIC_BASE from
# .env.mock; every enrollment created there "pays" through tunneld's
# built-in /mock-pay/<enrollment_id> page — no Stripe account, no
# card, no real charge.
#
# frps is deliberately NOT part of this profile: developing the
# registration / claim / account flow never touches the tunnel data
# plane, so a lone tunneld is the whole backend the client needs.
# (The frpc config handed out at claim time references the production
# frps address from tunneld's config; the client dev flow stops at
# claim + account state, it does not open a real tunnel here.)
#
# ⚠ INTERNAL / DEV USE ONLY. A mock instance lets anyone holding an
# enrollment link activate an account for free (see README "Mock
# pay"). NEVER expose a mock instance as the production API, and
# never run it on the production host/port — on the Oracle host this
# profile runs as a separate dev deployment, apart from the real
# relay in docker-compose.yml.

services:
  tunneld:
    build:
      context: ./tunneld
      dockerfile: Dockerfile
    image: homemcp/tunneld:mock
    restart: unless-stopped
    ports:
      # The ONLY published port: the mock API + mock checkout pages.
      # Host side is ${MOCK_PORT} (default 7200) from .env.mock.
      - "${MOCK_PORT:-7200}:7200"
    environment:
      # Mock pay is the entire point of this profile: hard on.
      TUNNELD_MOCK_PAY: "1"
      # Bind all interfaces INSIDE the container so the published
      # port can reach the process. (The binary's bare-host default
      # is localhost-only; do not copy this bind to a bare host.)
      TUNNELD_LISTEN: "0.0.0.0:7200"
      TUNNELD_STORE_PATH: "/data/tunneld.json"
      TUNNEL_DOMAIN: "${TUNNEL_DOMAIN:-tunnel.homemcp.si}"
      # The base URL the client uses — and the prefix of every
      # mock checkout URL tunneld returns. Must be the address the
      # client dev machine can actually reach (this host's LAN IP or
      # hostname), NOT localhost, unless client and server share a
      # host. Set it in .env.mock.
      API_PUBLIC_BASE: "${API_PUBLIC_BASE:?Set API_PUBLIC_BASE in .env.mock to the base URL the client will use}"
      # Gates the admin views and the mock subscription-event test
      # hook (X-Admin-Key). Required for client-dev state testing, so
      # this profile refuses to start without one.
      TUNNELD_ADMIN_KEY: "${TUNNELD_ADMIN_KEY:?Set TUNNELD_ADMIN_KEY in .env.mock (openssl rand -hex 32)}"
      USER_BANDWIDTH_LIMIT: "${USER_BANDWIDTH_LIMIT:-10MB}"
      # No STRIPE_* on purpose: mock mode never calls Stripe.
    volumes:
      - tunneld-mock-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # The distroless image has no shell; the binary self-probes.
      test: ["CMD", "/tunneld", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  tunneld-mock-data:
