services:
  frps:
    image: fatedier/frps:v0.68.0
    restart: unless-stopped
    ports:
      - "7000:7000/tcp"
      - "443:443/tcp"
    environment:
      FRP_TOKEN: "${FRP_TOKEN:?Set FRP_TOKEN in .env}"
    volumes:
      - ./frps.toml:/etc/frp/frps.toml:ro
    command: ["-c", "/etc/frp/frps.toml"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
