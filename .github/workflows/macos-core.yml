name: macOS developer build
on:
  push:
    branches: [main, integration/macos-ci-20261021]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Create private-repository developer pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: macos-dev-${{ github.run_id }}
        run: |
          gh release create "$TAG" --target "${{ github.sha }}" --prerelease \
            --title "HomeMCP macOS development build ${{ github.run_id }}" \
            --notes "Unsigned development binaries for installation testing only. Not notarized; local Node runtime and installer lifecycle still require work."

  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Node dependencies
        run: npm ci --ignore-scripts
      - name: Compile Keychain helper
        run: swiftc native/macos/keychain-helper.swift -framework Security -o native/macos/home-mcp-keychain
      - name: Prepare Playwright MCP worker
        run: |
          mkdir -p build/macos-worker
          npm install --prefix build/macos-worker --no-audit --no-fund --ignore-scripts --save=false @playwright/mcp@0.0.48
      - name: Run tests
        run: npm test
      - name: macOS Host smoke test
        run: sh scripts/macos/smoke-host.sh
      - name: Build SwiftUI Manager
        run: sh scripts/macos/build-manager.sh
      - name: Build unsigned developer package
        run: sh scripts/macos/package.sh
      - name: Upload package to GitHub pre-release (not Actions Artifacts)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: macos-dev-${{ github.run_id }}
        run: |
          cp build/macos-dist/HomeMCP-unsigned.pkg "HomeMCP-${{ matrix.runner }}-unsigned.pkg"
          gh release upload "$TAG" "HomeMCP-${{ matrix.runner }}-unsigned.pkg" --clobber
