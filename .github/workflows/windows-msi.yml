name: Windows MSI candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Unit tests
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Build private runtime payload
        shell: pwsh
        run: .\packaging\build-payload.ps1
      - name: Compile MSI (WiX 6)
        shell: pwsh
        run: |
          dotnet tool install --tool-path .\build\tools wix --version 6.0.2
          & .\build\tools\wix.exe build .\build\HomeMCP.generated.wxs -arch x64 -o .\dist\HomeMCP-0.1.6-x64.msi
          if ($LASTEXITCODE -ne 0) { throw 'wix build failed' }
      - name: Test silent MSI installation
        shell: pwsh
        run: |
          $msi=(Resolve-Path .\dist\HomeMCP-0.1.6-x64.msi).Path
          $p=Start-Process msiexec.exe -ArgumentList @('/i', ('"'+$msi+'"'), '/qn','/norestart','/l*v',"$env:TEMP\homemcp-msi.log") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:TEMP\homemcp-msi.log" -Tail 80; throw "MSI install failed $($p.ExitCode)" }
          & "$env:LOCALAPPDATA\HomeMCP\app\runtime\node.exe" --version
          & "$env:LOCALAPPDATA\HomeMCP\app\workers\windows-mcp.exe" --help
          & "$env:LOCALAPPDATA\HomeMCP\app\runtime\node.exe" "$env:LOCALAPPDATA\HomeMCP\app\workers\playwright\cli.js" --help
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HomeMCP-msi-candidate
          path: dist/*.msi
          if-no-files-found: error
