name: Windows MSI candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Unit tests
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Compile Windows tray manager
        shell: pwsh
        run: dotnet build .\native\Manager\Manager.csproj -c Release
      - name: Build private runtime payload
        shell: pwsh
        run: .\packaging\build-payload.ps1
      - name: Compile MSI (WiX 6)
        shell: pwsh
        run: |
          dotnet tool install --tool-path .\build\tools wix --version 6.0.2
          & .\build\tools\wix.exe build .\build\HomeMCP.generated.wxs -arch x64 -o .\dist\HomeMCP-0.1.16-x64.msi
          if ($LASTEXITCODE -ne 0) { throw 'wix build failed' }
      - name: Test silent MSI installation
        shell: pwsh
        run: |
          $msi=(Resolve-Path .\dist\HomeMCP-0.1.16-x64.msi).Path
          $p=Start-Process msiexec.exe -ArgumentList @('/i', ('"'+$msi+'"'), '/qn','/norestart','/l*v',"$env:TEMP\homemcp-msi.log") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:TEMP\homemcp-msi.log" -Tail 80; throw "MSI install failed $($p.ExitCode)" }
          & "$env:LOCALAPPDATA\HomeMCP\app\runtime\node.exe" --version
          & "$env:LOCALAPPDATA\HomeMCP\app\workers\windows-mcp.exe" --help
          & "$env:LOCALAPPDATA\HomeMCP\app\runtime\node.exe" "$env:LOCALAPPDATA\HomeMCP\app\workers\playwright\cli.mjs" --help
      - name: Test installed provisioning on Windows PowerShell 5.1
        shell: pwsh
        run: |
          $app=Join-Path $env:LOCALAPPDATA 'HomeMCP\app'
          $scratch=Join-Path $env:RUNNER_TEMP 'homemcp-native-ps-test'
          New-Item -ItemType Directory -Force $scratch | Out-Null
          $conf=Join-Path $scratch 'config.json'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $app 'scripts\provision-installed.ps1') -AppDir $app -ConfigPath $conf
          if ($LASTEXITCODE -ne 0) { throw "Provision failed on Windows PowerShell 5.1: $LASTEXITCODE" }
          if (!(Test-Path $conf)) { throw 'Installed provision script did not create config.json' }
          $c=Get-Content $conf -Raw | ConvertFrom-Json
          if ($c.token.Length -ne 64 -or $c.security.adminToken.Length -ne 64) { throw 'Generated token invalid' }
          Remove-Item $conf -Force
          $runner=Join-Path $app 'runtime\HomeMCP.JobRunner.exe'
          $marker=Join-Path $scratch 'runner-started.txt'
          & $runner --parent $PID -- "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -Command "Set-Content -LiteralPath '$marker' -Value ok"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $marker)) { throw 'JobRunner could not launch Windows PowerShell with an absolute path' }
      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: HomeMCP-msi-candidate
          path: dist/*.msi
          if-no-files-found: error
