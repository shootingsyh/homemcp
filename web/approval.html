<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect device · HomeMCP</title>
<style>
:root{color-scheme:light dark}body{font:17px/1.5 system-ui,-apple-system,sans-serif;max-width:560px;margin:0 auto;padding:clamp(24px,7vw,60px) 20px}h1{font-size:30px;line-height:1.2;margin:0 0 14px}p{opacity:.85}button,input{font:inherit;border-radius:12px;padding:12px 18px;min-height:50px;box-sizing:border-box}button{cursor:pointer}#register,#login{background:#1765d1;border:0;color:white;width:100%;font-size:18px;font-weight:650}#refresh,#logout{background:transparent;border:1px solid #9998}#actions{display:flex;gap:8px;flex-wrap:wrap}#actions button{flex:1}#enrollment{margin:24px 0}#bootstrap{width:100%;margin-bottom:12px}article{border:1px solid #9998;padding:20px;margin:18px 0;border-radius:14px}article pre{white-space:pre-wrap;overflow-wrap:anywhere}article button{margin:6px 8px 6px 0}#status{min-height:28px}section[hidden],button[hidden],input[hidden]{display:none}
</style>
<h1 id="heading">HomeMCP</h1><p id="intro">Connect this phone securely using a Passkey.</p>
<section id="enrollment" hidden><input id="bootstrap" type="password" autocomplete="off" placeholder="Local admin token" hidden><button id="register">Connect this device</button></section>
<section id="actions" hidden><button id="login">Sign in with Passkey</button><button id="refresh">Refresh</button><button id="logout">Sign out</button></section>
<p id="status" role="status" aria-live="polite"></p><main id="queue"></main>
<script src="/approval.js" defer></script></html>
